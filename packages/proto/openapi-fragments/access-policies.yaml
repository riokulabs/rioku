# Stage-2 plan-02 identity: access policies (CEL-evaluated authz rules).
#
# Mirrors RegisterAccessPolicyRoutes in
# packages/daemon/internal/gateway/access_policies_routes.go.
#
# Both legacy /api/v1/auth/access-policies and tenant-scoped
# /api/v1/t/{tenant}/access-policies paths are documented.

paths:
  /api/v1/t/{tenant}/access-policies:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      tags: [access-policies]
      operationId: listAccessPolicies
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessPolicies:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        tenantId: { type: string }
                        name: { type: string }
                        description: { type: string }
                        expression: { type: string }
                        effect: { type: string, enum: [allow, deny] }
                        priority: { type: integer }
                        enabled: { type: boolean }
                        createdAt: { type: string, format: date-time }
                        updatedAt: { type: string, format: date-time }
                  nextPageToken: { type: string }
    post:
      tags: [access-policies]
      operationId: createAccessPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, expression]
              properties:
                name: { type: string }
                description: { type: string }
                expression:
                  type: string
                  description: "CEL expression evaluated against the request context."
                effect:
                  type: string
                  enum: [allow, deny]
                  default: allow
                priority:
                  type: integer
                  description: "Lower priority numbers evaluate first."
                enabled: { type: boolean, default: true }
      responses:
        "201": { description: created }
    options:
      responses: { "204": { description: no content } }

  /api/v1/t/{tenant}/access-policies/{id}:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/ID"
    get:
      tags: [access-policies]
      operationId: getAccessPolicy
      responses: { "200": { description: ok }, "404": { description: not found } }
    put:
      tags: [access-policies]
      operationId: replaceAccessPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, expression]
              properties:
                name: { type: string }
                description: { type: string }
                expression: { type: string }
                effect: { type: string, enum: [allow, deny] }
                priority: { type: integer }
                enabled: { type: boolean }
      responses: { "200": { description: ok } }
    patch:
      tags: [access-policies]
      operationId: patchAccessPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                expression: { type: string }
                effect: { type: string, enum: [allow, deny] }
                priority: { type: integer }
                enabled: { type: boolean }
      responses: { "200": { description: ok } }
    delete:
      tags: [access-policies]
      operationId: deleteAccessPolicy
      responses: { "204": { description: deleted } }
    options:
      responses: { "204": { description: no content } }


  /api/v1/t/{tenant}/access-policies/test-cel:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    post:
      tags: [access-policies]
      operationId: testAccessPolicyCel
      summary: "Dry-run a CEL expression against a sample event."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expression]
              properties:
                expression: { type: string }
                sample:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: evaluation result
          content:
            application/json:
              schema:
                type: object
                required: [matched, durationMs]
                properties:
                  matched: { type: boolean }
                  error: { type: string }
                  durationMs: { type: number }
        "400": { description: bad request envelope }
    options:
      responses: { "204": { description: no content } }
