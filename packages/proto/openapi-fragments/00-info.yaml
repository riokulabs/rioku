# Top-of-document fragment: API metadata, server list, security schemes,
# and the canonical OpenAPI version. Loaded first (alphabetical) so
# subsequent fragments overlay onto these defaults.
#
# Per-resource fragments live next to this file as `<resource>.yaml`
# and contribute `paths:` entries plus any reusable schemas under
# `components.schemas`.

openapi: "3.1.0"

info:
  title: "Rioku API"
  description: |
    Rioku is an open-source, AI-native API gateway platform built on
    Caddy. This document is the canonical OpenAPI 3.1 specification
    for every REST endpoint exposed by the daemon.

    Conventions:

    - Tenant-scoped paths live under `/api/v1/t/{tenant}/...`.
    - Every resource exposes `OPTIONS` for capability discovery.
    - Both `PUT` (replace, full body) and `PATCH` (partial, RFC 7396
      merge-patch) are supported on every resource that takes
      mutations.
    - Relations carry both the foreign-key id AND a `_links.<relation>.href`
      pointing at the canonical resource path.
    - Pagination is cursor-based (`?page_token=`); page size is
      bounded at 1000.

  version: "0.1.0"
  contact:
    name: "Rioku Labs"
    url: "https://github.com/riokulabs/rioku"
  license:
    name: "BUSL-1.1"
    url: "https://github.com/riokulabs/rioku/blob/main/LICENSE"

servers:
  - url: "{scheme}://{host}/api/v1"
    description: "Rioku daemon REST endpoint"
    variables:
      scheme:
        default: "https"
        enum: ["https", "http"]
      host:
        default: "localhost:7778"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: rioku_sid
      description: "Web-UI session cookie issued by /api/v1/auth/login."
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "API key or short-lived JWT issued by /api/v1/auth/token."

  schemas:
    Link:
      type: object
      required: [href]
      properties:
        href:
          type: string
          format: uri-reference
        templated:
          type: boolean
      description: |
        OpenAPI/HAL hypermedia reference. Every resource emits a
        `_links` map keyed by relation name (`self`, `owner`, `tools`,
        `traces`, etc.) with a Link object.
    LinkSet:
      type: object
      additionalProperties:
        $ref: "#/components/schemas/Link"
    Problem:
      type: object
      description: "RFC 7807 problem+json error envelope."
      required: [type, title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              reason:
                type: string

security:
  - sessionCookie: []
  - bearerToken: []
