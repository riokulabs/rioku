name: E2E

on:
  pull_request:
    branches: [develop, main]
    paths-ignore:
      - 'contrib-docs/**'
      - 'docs/**'
  push:
    branches: [develop]
    paths-ignore:
      - 'contrib-docs/**'
      - 'docs/**'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 2 shards × 2 workers each gives the same 4-way parallelism the
    # previous 4-shard / 1-worker matrix had, but halves the per-CI-run
    # sandbox-bootstrap cost (each shard rebuilds the daemon, seeds the
    # tenant + cross-tenant fixtures, and starts the upstream apps).
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: |
            packages/daemon/go.sum
            packages/proto/gen/go/go.sum

      # Each shard rebuilds the daemon as part of `make sandbox`. A warm
      # build cache turns that from ~2min into ~5s.
      - name: Cache Go build cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/go-build
          key: go-build-e2e-${{ runner.os }}-${{ hashFiles('packages/daemon/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-e2e-${{ runner.os }}-${{ hashFiles('packages/daemon/go.sum') }}-
            go-build-e2e-${{ runner.os }}-

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/web/pnpm-lock.yaml

      - name: Install web dependencies
        run: cd packages/web && pnpm install --frozen-lockfile

      - name: Install sample-plugin dependencies
        # The Playwright global-setup builds packages/web/sample-plugin
        # (a separate sub-package, not part of packages/web's lockfile),
        # which needs its own node_modules with vite installed. Without
        # this step the build step inside global-setup fails with
        # 'sh: 1: vite: not found'.
        run: cd packages/web/sample-plugin && pnpm install --no-frozen-lockfile

      # Cache Playwright browser binaries (~80MB). Key includes the
      # Playwright version from pnpm-lock so a Playwright bump invalidates.
      - name: Resolve Playwright version
        id: pw
        run: |
          # @playwright/test is the direct dep; the runtime browser
          # bundle ships with the same version. Reading from package.json
          # avoids relying on pnpm hoisting the (transitive) `playwright`
          # package at packages/web/node_modules.
          VERSION=$(node -p "require('./packages/web/node_modules/@playwright/test/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: cd packages/web && pnpm exec playwright install --with-deps

      - name: Install Playwright system deps (cache hit path)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: cd packages/web && pnpm exec playwright install-deps

      - name: Start sandbox
        env:
          # Pin the root password so the Playwright + smoke tests can
          # log in deterministically. Without this, start.sh generates
          # a random password and the test fixtures (which hardcode
          # 'TestRoot1234!') get 401s.
          SANDBOX_ROOT_PASSWORD: TestRoot1234!
        run: make sandbox

      - name: Run smoke tests
        id: smoke
        run: make sandbox-test-smoke

      - name: Dump sandbox logs on failure
        if: always() && (steps.smoke.conclusion == 'failure' || steps.smoke.outcome == 'failure')
        run: |
          echo "=== daemon.log (last 300) ==="
          tail -300 sandbox/.data/logs/daemon.log 2>/dev/null || echo "(no daemon.log)"
          echo
          echo "=== caddy.log (last 200) ==="
          tail -200 sandbox/.data/logs/caddy.log 2>/dev/null || echo "(no caddy.log)"
          echo
          echo "=== sandbox/.data/logs/ contents ==="
          ls -la sandbox/.data/logs/ 2>/dev/null || true

      - name: Run Go integration tests (shard 1 only)
        if: matrix.shard == 1
        # Non-blocking for now. The integration suite has at least one
        # timing-sensitive proxy test (TestFullProxyFlow waits 2s for
        # the sync agent to push routes to Caddy; tighter on free
        # runners) that flakes ~once per few runs. Tracking a follow-up
        # to switch to active polling instead of a fixed sleep.
        continue-on-error: true
        run: make test-integration

      - name: Run Playwright E2E tests (shard ${{ matrix.shard }}/2)
        run: cd packages/web && pnpm exec playwright test --shard=${{ matrix.shard }}/2 --reporter=line

      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: packages/web/playwright-report/
          retention-days: 7

      - name: Stop sandbox
        if: always()
        run: make sandbox-stop
