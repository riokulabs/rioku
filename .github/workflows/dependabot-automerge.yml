name: Dependabot Auto-Merge

# Auto-approve and auto-merge low-risk Dependabot PRs once all required
# checks pass. "Low-risk" means:
#   - patch or security updates (any package)
#   - minor updates for grouped dev/test tooling (eslint, vitest, types)
#   - minor updates for github-actions
#
# Major bumps and minor bumps for runtime dependencies still require
# manual review.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve + enable auto-merge for low-risk bumps
        if: |
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.dependency-type == 'direct:development' ||
          steps.meta.outputs.dependency-group == 'eslint' ||
          steps.meta.outputs.dependency-group == 'vitest' ||
          steps.meta.outputs.dependency-group == 'types' ||
          steps.meta.outputs.dependency-group == 'security' ||
          (steps.meta.outputs.package-ecosystem == 'github_actions' && steps.meta.outputs.update-type != 'version-update:semver-major')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr review --approve "$PR_URL" --body "Auto-approved: low-risk Dependabot bump (${{ steps.meta.outputs.update-type }} / ${{ steps.meta.outputs.dependency-group }})."
          gh pr merge --auto --squash "$PR_URL"
