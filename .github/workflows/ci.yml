name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-lint:
    name: Commit Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate commit messages
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}
          ERRORS=0
          while IFS= read -r sha; do
            MSG=$(git log --format=%s -n 1 "$sha")
            if ! .githooks/lint-commit.sh <(echo "$MSG") 2>&1; then
              ERRORS=$((ERRORS + 1))
            fi
          done < <(git rev-list "$BASE".."$HEAD")
          if [ "$ERRORS" -gt 0 ]; then
            echo ""
            echo "Found $ERRORS commit(s) with invalid messages."
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: |
            packages/daemon/go.sum
            packages/build-service/go.sum
            packages/proto/gen/go/go.sum

      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@latest

      - name: gofmt + goimports drift check
        run: |
          set -euo pipefail
          GO_FILES=$(find packages -type f -name '*.go' -not -path '*/gen/*' -not -path '*/node_modules/*')
          GOFMT_BAD=$(gofmt -l $GO_FILES || true)
          if [ -n "$GOFMT_BAD" ]; then
            echo "gofmt drift in:"
            echo "$GOFMT_BAD"
            exit 1
          fi
          GOIMPORTS_BAD=$(goimports -l $GO_FILES || true)
          if [ -n "$GOIMPORTS_BAD" ]; then
            echo "goimports drift in:"
            echo "$GOIMPORTS_BAD"
            exit 1
          fi

      - name: golangci-lint (daemon)
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: packages/daemon
          args: --build-tags noadmin

      - name: golangci-lint (build-service)
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: packages/build-service

  proto:
    name: Proto Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - uses: bufbuild/buf-action@v1
        with:
          input: packages/proto
          lint: true
          breaking: false
          format: false

  spell:
    name: Spell Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run cspell
        uses: streetsidesoftware/cspell-action@v8
        with:
          config: cspell.config.yaml
          files: "**/*.{go,md,proto,yaml,yml}"

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: |
            packages/daemon/go.sum
            packages/build-service/go.sum
            packages/proto/gen/go/go.sum

      - name: Test daemon (race)
        run: |
          SHORT_FLAG=""
          if [ "${{ github.event_name }}" = "push" ]; then
            SHORT_FLAG="-short"
            echo "Push event — running short tests only"
          else
            echo "PR event — running full test suite"
          fi
          # -timeout is per-package. The gateway package alone has 197
          # integration tests, each spinning up a fresh sqlite store +
          # running all 47 migrations (~3s/test under -race contention)
          # for ~600s minimum. The auth scale tests are gated behind the
          # `scale` build tag so PR CI doesn't run them. 1500s gives the
          # gateway package room to finish while still bounding hung
          # tests; total job time is bounded by GitHub's default
          # 360-minute job timeout (no explicit timeout-minutes set).
          cd packages/daemon && go test -tags noadmin -race -count=1 -timeout=1500s ${SHORT_FLAG} ./...

      - name: Test build-service (race)
        run: cd packages/build-service && go test -race -count=1 -timeout=300s ./...

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: |
            packages/daemon/go.sum
            packages/build-service/go.sum
            packages/proto/gen/go/go.sum

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/web/pnpm-lock.yaml

      - name: Install web dependencies
        run: cd packages/web && pnpm install --frozen-lockfile

      - name: Start sandbox
        run: make sandbox

      - name: Run smoke tests
        run: make sandbox-test-smoke

      - name: Install Playwright browsers
        run: cd packages/web && pnpm exec playwright install --with-deps

      - name: Run Playwright E2E tests
        run: cd packages/web && pnpm exec playwright test

      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: packages/web/playwright-report/
          retention-days: 7

      - name: Stop sandbox
        if: always()
        run: make sandbox-stop

  web:
    name: Web (lint + typecheck + test + e2e + bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/web/pnpm-lock.yaml
      - name: Install web deps
        run: cd packages/web && pnpm install --frozen-lockfile
      - name: Verify generated admin client is up-to-date
        run: |
          make web-types
          if [ -n "$(git status --porcelain packages/web/src/api/generated)" ]; then
            echo "::error::Generated admin client is out of date. Run 'make web-types' locally and commit."
            git diff packages/web/src/api/generated | head -200
            exit 1
          fi
      - name: Lint
        run: cd packages/web && pnpm lint
      - name: Typecheck
        run: cd packages/web && pnpm typecheck
      - name: Format check
        run: cd packages/web && pnpm format:check
      - name: Unit + component tests
        run: cd packages/web && pnpm test
      - name: Install Playwright browsers
        run: cd packages/web && pnpm test:e2e:install
      - name: E2E smoke
        run: cd packages/web && pnpm test:e2e
      - name: Build
        run: cd packages/web && pnpm build
      - name: Check bundle budgets
        run: cd packages/web && pnpm check-budgets
      - name: Check ABI surface (B4)
        run: cd packages/web && pnpm check-abi
      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: packages/web/playwright-report/
          retention-days: 7
