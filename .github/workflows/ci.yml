name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-lint:
    name: Commit Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit messages
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}
          ERRORS=0
          while IFS= read -r sha; do
            MSG=$(git log --format=%s -n 1 "$sha")
            if ! .githooks/lint-commit.sh <(echo "$MSG") 2>&1; then
              ERRORS=$((ERRORS + 1))
            fi
          done < <(git rev-list "$BASE".."$HEAD")
          if [ "$ERRORS" -gt 0 ]; then
            echo ""
            echo "Found $ERRORS commit(s) with invalid messages."
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/daemon/go.mod

      - uses: bufbuild/buf-setup-action@v1

      - name: Generate proto code
        run: make proto

      - name: Go vet
        run: |
          cd packages/daemon && go vet -tags noadmin ./...
          cd ../build-service && go vet ./...

      - name: golangci-lint (daemon)
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: packages/daemon
          args: --build-tags noadmin
          version: v2.11.4
          install-mode: goinstall

      - name: golangci-lint (build-service)
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: packages/build-service
          version: v2.11.4
          install-mode: goinstall

  proto:
    name: Proto Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bufbuild/buf-action@v1
        with:
          input: packages/proto
          lint: true
          breaking: false

  spell:
    name: Spell Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run cspell
        uses: streetsidesoftware/cspell-action@v6
        with:
          config: cspell.config.yaml
          files: "**/*.{go,md,proto,yaml,yml}"

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/daemon/go.mod

      - uses: bufbuild/buf-setup-action@v1

      - name: Generate proto code
        run: make proto

      - name: Test daemon (race)
        run: cd packages/daemon && go test -tags noadmin -race -count=1 -timeout=300s ./...

      - name: Test build-service (race)
        run: cd packages/build-service && go test -race -count=1 -timeout=300s ./...

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/daemon/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: bufbuild/buf-setup-action@v1

      - name: Generate proto code
        run: make proto

      - name: Install web dependencies
        run: cd packages/web && npm ci

      - name: Start sandbox
        run: make sandbox &

      - name: Wait for sandbox health
        run: |
          for i in $(seq 1 60); do
            if curl -sf --max-time 2 http://localhost:7778/api/v1/health; then
              echo "Sandbox is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Sandbox did not become healthy after 120s"
          echo "=== Diagnostic info ==="
          echo "--- Listening ports ---"
          ss -tlnp 2>/dev/null | grep -E '7777|7778|8443|9001|9002|9003|9004|9005|2019' || echo "No matching ports"
          echo "--- Screen sessions ---"
          screen -ls 2>/dev/null || echo "No screen sessions"
          echo "--- Daemon log (last 30 lines) ---"
          tail -30 sandbox/.data/daemon.log 2>/dev/null || echo "No daemon log"
          echo "--- Daemon PID file ---"
          cat sandbox/.data/rioku.pid 2>/dev/null || echo "No PID file"
          echo "--- Init log ---"
          tail -20 sandbox/.data/init.log 2>/dev/null || echo "No init log"
          echo "--- Process list ---"
          ps aux | grep -E 'rioku|caddy' | grep -v grep || echo "No rioku/caddy processes"
          echo "--- curl verbose ---"
          curl -v --max-time 5 http://localhost:7778/api/v1/health 2>&1 || true
          exit 1

      - name: Run smoke tests
        run: make sandbox-test-smoke

      - name: Install Playwright browsers
        run: cd packages/web && npx playwright install --with-deps

      - name: Run Playwright E2E tests
        run: cd packages/web && npx playwright test

      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: packages/web/playwright-report/
          retention-days: 7

      - name: Stop sandbox
        if: always()
        run: make sandbox-stop
