name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-lint:
    name: Commit Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate commit messages
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}
          ERRORS=0
          while IFS= read -r sha; do
            MSG=$(git log --format=%s -n 1 "$sha")
            if ! .githooks/lint-commit.sh <(echo "$MSG") 2>&1; then
              ERRORS=$((ERRORS + 1))
            fi
          done < <(git rev-list "$BASE".."$HEAD")
          if [ "$ERRORS" -gt 0 ]; then
            echo ""
            echo "Found $ERRORS commit(s) with invalid messages."
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: |
            packages/daemon/go.sum
            packages/build-service/go.sum
            packages/proto/gen/go/go.sum

      - name: golangci-lint (daemon)
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: packages/daemon
          args: --build-tags noadmin

      - name: golangci-lint (build-service)
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: packages/build-service

  proto:
    name: Proto Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: bufbuild/buf-action@v1
        with:
          input: packages/proto
          lint: true
          breaking: false

  spell:
    name: Spell Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run cspell
        uses: streetsidesoftware/cspell-action@v8
        with:
          config: cspell.config.yaml
          files: "**/*.{go,md,proto,yaml,yml}"

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: |
            packages/daemon/go.sum
            packages/build-service/go.sum
            packages/proto/gen/go/go.sum

      - name: Test daemon (race)
        run: |
          SHORT_FLAG=""
          if [ "${{ github.event_name }}" = "push" ]; then
            SHORT_FLAG="-short"
            echo "Push event — running short tests only"
          else
            echo "PR event — running full test suite"
          fi
          cd packages/daemon && go test -tags noadmin -race -count=1 -timeout=300s ${SHORT_FLAG} ./...

      - name: Test build-service (race)
        run: cd packages/build-service && go test -race -count=1 -timeout=300s ./...

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: |
            packages/daemon/go.sum
            packages/build-service/go.sum
            packages/proto/gen/go/go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/web/package-lock.json

      - name: Install web dependencies
        run: cd packages/web && npm ci

      - name: Start sandbox
        run: make sandbox

      - name: Run smoke tests
        run: make sandbox-test-smoke

      - name: Install Playwright browsers
        run: cd packages/web && npx playwright install --with-deps

      - name: Run Playwright E2E tests
        run: cd packages/web && npx playwright test

      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: packages/web/playwright-report/
          retention-days: 7

      - name: Stop sandbox
        if: always()
        run: make sandbox-stop

  web:
    name: Web (lint + typecheck + test + e2e + bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/web/package-lock.json
      - name: Install web deps
        run: cd packages/web && npm ci --legacy-peer-deps
      - name: Lint
        run: cd packages/web && npm run lint
      - name: Typecheck
        run: cd packages/web && npm run typecheck
      - name: Format check
        run: cd packages/web && npm run format:check
      - name: Unit + component tests
        run: cd packages/web && npm run test
      - name: Install Playwright browsers
        run: cd packages/web && npm run test:e2e:install
      - name: E2E smoke
        run: cd packages/web && npm run test:e2e
      - name: Build
        run: cd packages/web && npm run build
      - name: Check bundle budgets
        run: cd packages/web && npm run check-budgets
      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: packages/web/playwright-report/
          retention-days: 7
