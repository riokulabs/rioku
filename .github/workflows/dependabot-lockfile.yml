name: Dependabot Lockfile Refresh

# Dependabot opens PRs that update package.json (and Go go.sum) but
# pnpm-lock.yaml is NOT regenerated by GitHub's Dependabot for pnpm
# projects — only the npm-style workspace gets a fresh lock. This
# workflow regenerates pnpm-lock.yaml (and Go go.sum via `go mod tidy`)
# on every push to a Dependabot branch and commits the result back, so
# the PR always carries a consistent lockfile.
#
# The same workflow doubles as a merge-conflict guard: when the base
# branch moves, Dependabot's auto-rebase fires, this workflow runs on
# the rebased push, and the lockfile is reconciled before any human
# review.
#
# Triggered on push (not pull_request_target) so the standard
# GITHUB_TOKEN can push back to the branch — no additional secret
# wiring needed. The job is gated on github.actor to ensure only
# Dependabot pushes are processed.

on:
  push:
    branches:
      - "dependabot/**"

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-pnpm:
    name: Refresh pnpm-lock.yaml
    if: github.actor == 'dependabot[bot]' && startsWith(github.ref_name, 'dependabot/npm_and_yarn/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          # token must persist for the push at the end of the job
          persist-credentials: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/web/pnpm-lock.yaml

      - name: Regenerate pnpm-lock.yaml
        run: |
          cd packages/web
          # --no-frozen-lockfile lets pnpm reconcile the lock with the
          # updated package.json that Dependabot wrote.
          pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Commit + push if lockfile changed
        run: |
          if [ -z "$(git status --porcelain packages/web/pnpm-lock.yaml)" ]; then
            echo "Lockfile already in sync — nothing to do."
            exit 0
          fi
          git config user.name "dependabot[bot]"
          git config user.email "49699333+dependabot[bot]@users.noreply.github.com"
          git add packages/web/pnpm-lock.yaml
          git commit -m "chore(web): refresh pnpm-lock.yaml after Dependabot bump"
          git push origin HEAD:${{ github.ref_name }}

  refresh-gomod:
    name: Refresh go.sum (${{ matrix.module }})
    if: github.actor == 'dependabot[bot]' && startsWith(github.ref_name, 'dependabot/go_modules/')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each Dependabot gomod PR only touches one module, but we run
        # `go mod tidy` against all of them so any transitive drift
        # (e.g. a workspace-level replace directive) gets reconciled.
        module:
          - packages/daemon
          - packages/build-service
          - packages/plugins
          - packages/proto/gen/go
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: go mod tidy
        run: cd ${{ matrix.module }} && go mod tidy

      - name: Commit + push if go.sum changed
        run: |
          if [ -z "$(git status --porcelain ${{ matrix.module }})" ]; then
            echo "${{ matrix.module }} go.sum already in sync — nothing to do."
            exit 0
          fi
          git config user.name "dependabot[bot]"
          git config user.email "49699333+dependabot[bot]@users.noreply.github.com"
          git add ${{ matrix.module }}/go.mod ${{ matrix.module }}/go.sum
          git commit -m "chore(${{ matrix.module }}): go mod tidy after Dependabot bump"
          git push origin HEAD:${{ github.ref_name }}
