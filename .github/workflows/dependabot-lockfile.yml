name: Dependabot Lockfile Refresh

# Dependabot opens PRs that update package.json (and Go go.sum) but
# pnpm-lock.yaml is NOT regenerated by GitHub's Dependabot for pnpm
# projects — only the npm-style workspace gets a fresh lock. This
# workflow regenerates pnpm-lock.yaml (and Go go.sum via `go mod tidy`)
# on every push to a Dependabot branch and commits the result back, so
# the PR always carries a consistent lockfile.
#
# The same workflow doubles as a merge-conflict guard: when the base
# branch moves, Dependabot's auto-rebase fires, this workflow runs on
# the rebased push, and the lockfile is reconciled before any human
# review.
#
# Triggered on push (not pull_request_target) so the standard
# GITHUB_TOKEN can push back to the branch — no additional secret
# wiring needed. The job is gated on github.actor to ensure only
# Dependabot pushes are processed.

on:
  push:
    branches:
      - "dependabot/**"

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-pnpm:
    name: Refresh pnpm-lock.yaml
    # Only packages/web uses pnpm. /docs and /contrib-docs use plain npm
    # and Dependabot reconciles their package-lock.json natively, so we
    # match the packages/web prefix specifically rather than the broader
    # 'dependabot/npm_and_yarn/' which would also match docs PRs.
    if: github.actor == 'dependabot[bot]' && startsWith(github.ref_name, 'dependabot/npm_and_yarn/packages/web/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          # token must persist for the push at the end of the job
          persist-credentials: true

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/web/pnpm-lock.yaml

      - name: Regenerate pnpm-lock.yaml
        run: |
          cd packages/web
          # --no-frozen-lockfile lets pnpm reconcile the lock with the
          # updated package.json that Dependabot wrote.
          pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Commit + push if lockfile changed
        run: |
          if [ -z "$(git status --porcelain packages/web/pnpm-lock.yaml)" ]; then
            echo "Lockfile already in sync — nothing to do."
            exit 0
          fi
          git config user.name "dependabot[bot]"
          git config user.email "49699333+dependabot[bot]@users.noreply.github.com"
          git add packages/web/pnpm-lock.yaml
          git commit -m "chore(web): refresh pnpm-lock.yaml after Dependabot bump"
          git push origin HEAD:${{ github.ref_name }}

  refresh-gomod:
    name: Refresh go.sum
    if: github.actor == 'dependabot[bot]' && startsWith(github.ref_name, 'dependabot/go_modules/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      # Dependabot encodes the module path in the branch name as
      # 'dependabot/go_modules/<module-path>/<dep>-<version>'. Extract
      # the module path so we only run `go mod tidy` in the affected
      # module rather than spinning up a 4-way matrix that no-ops 3
      # times every run.
      - name: Resolve target module from branch name
        id: target
        run: |
          set -euo pipefail
          BRANCH="${{ github.ref_name }}"
          # Strip the prefix.
          REST="${BRANCH#dependabot/go_modules/}"
          # Walk known module roots and pick the longest prefix match.
          MOD=""
          for candidate in \
            packages/daemon \
            packages/build-service \
            packages/plugins \
            packages/proto/gen/go; do
            case "$REST" in
              "$candidate"/*) MOD="$candidate" ;;
            esac
          done
          if [ -z "$MOD" ]; then
            echo "::warning::Could not resolve module from branch '$BRANCH' — skipping refresh."
            echo "module=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "module=$MOD" >> "$GITHUB_OUTPUT"
          echo "Resolved module: $MOD"

      - uses: actions/setup-go@v6
        if: steps.target.outputs.module != ''
        with:
          go-version-file: go.work
          cache-dependency-path: ${{ steps.target.outputs.module }}/go.sum

      - name: go mod tidy
        if: steps.target.outputs.module != ''
        run: cd ${{ steps.target.outputs.module }} && go mod tidy

      - name: Commit + push if go.sum changed
        if: steps.target.outputs.module != ''
        run: |
          MOD="${{ steps.target.outputs.module }}"
          if [ -z "$(git status --porcelain "$MOD")" ]; then
            echo "$MOD go.sum already in sync — nothing to do."
            exit 0
          fi
          git config user.name "dependabot[bot]"
          git config user.email "49699333+dependabot[bot]@users.noreply.github.com"
          git add "$MOD/go.mod" "$MOD/go.sum"
          git commit -m "chore($MOD): go mod tidy after Dependabot bump"
          git push origin HEAD:${{ github.ref_name }}
