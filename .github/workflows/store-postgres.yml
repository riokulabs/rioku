name: Store - Postgres Integration

on:
  pull_request:
    paths:
      - 'packages/daemon/internal/store/**'
      - '.github/workflows/store-postgres.yml'
  push:
    branches: [main, plan/daemon-fundamentals]
    paths:
      - 'packages/daemon/internal/store/**'
      - '.github/workflows/store-postgres.yml'

jobs:
  postgres-15:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: rioku
          POSTGRES_PASSWORD: rioku_test
          POSTGRES_DB: rioku_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Run Postgres integration tests
        env:
          POSTGRES_TEST_DSN: postgres://rioku:rioku_test@localhost:5432/rioku_test?sslmode=disable
        run: |
          cd packages/daemon
          go test -race -count=1 ./internal/store/postgres/...

  postgres-18:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: rioku
          POSTGRES_PASSWORD: rioku_test
          POSTGRES_DB: rioku_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Run Postgres integration tests
        env:
          POSTGRES_TEST_DSN: postgres://rioku:rioku_test@localhost:5432/rioku_test?sslmode=disable
        run: |
          cd packages/daemon
          go test -race -count=1 ./internal/store/postgres/...
