name: CodeQL

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  schedule:
    # Weekly Sunday 03:00 UTC for full re-analysis with the latest
    # query packs.
    - cron: '0 3 * * 0'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Non-blocking for now. CodeQL still scans every PR and posts alerts
    # to the Security tab, but its conclusion does not gate merges.
    # Revisit once the existing alert backlog is triaged.
    continue-on-error: true
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        if: matrix.language == 'go'
        with:
          go-version-file: go.work
          cache-dependency-path: |
            packages/daemon/go.sum
            packages/build-service/go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended,security-and-quality

      - name: Autobuild (Go only)
        if: matrix.language == 'go'
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
