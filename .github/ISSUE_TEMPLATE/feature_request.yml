name: Feature Request
description: Suggest a new feature or enhancement
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for Rioku? We'd love to hear it. Please describe the problem you're trying to solve before jumping to a solution.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? Why is this needed?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How do you think this should work? Be as specific as you can.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered other approaches? What are the tradeoffs?
    validations:
      required: false
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of Rioku does this relate to?
      options:
        - Daemon
        - CLI (`rku`)
        - Admin Panel
        - Plugin System
        - Config Store
        - Cluster / Sync
        - Build Service
        - gRPC / REST API
        - PKI / Certificates
        - AI / LLM Proxy
        - Documentation
        - New Component
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context, screenshots, or references.
    validations:
      required: false
