# golangci-lint configuration for Rioku monorepo.
# Docs: https://golangci-lint.run/usage/configuration/

version: "2"

linters:
  enable:
    - forbidigo

linters-settings:
  forbidigo:
    forbid:
      # Gateway handlers must use rerr.H / rerr.JSON instead of http.Error.
      - pattern: "^http\\.Error$"
        message: "use rerr.Validation / rerr.Wrap / rerr.NotFound instead of http.Error in gateway handlers"
      # Gateway package must use logging.From(ctx) instead of slog.Default().
      - pattern: "^slog\\.Default$"
        message: "use logging.From(r.Context()) instead of slog.Default() in gateway handlers"

issues:
  # Only enforce forbidigo rules inside the gateway package.
  exclude-rules:
    - path-except: "packages/daemon/internal/gateway/"
      linters:
        - forbidigo
